input {
  # логи docker-контейнеров от filebeat
  beats {
    port => 5046
  }
  # json-сообщения по tcp: один json-объект на строку
  tcp {
    port  => 5044
    codec => json_lines
    tags  => ["tcp_json"]
  }
}

# filter { json { source => "json" } } из help убран: поле [json] filebeat уже
# декодирует сам (decode_json_fields), и фильтр на каждое событие писал
# "Error parsing json" и ставил тег _jsonparsefailure

output {
  elasticsearch {
    hosts => ["es-hot:9200"]
    index => "logstash-%{+YYYY.MM.dd}"
  }
}
